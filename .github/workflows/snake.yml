name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *"   # once a day, 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: TiaKohir
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=0f766e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=2dd4bf

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
