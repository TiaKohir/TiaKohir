<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Tia Kohir — clinical chart header">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a3f"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="28%" stop-color="#34d399"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="76%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#93c5fd" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="url(#band)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect x="0" y="254" width="1200" height="6" fill="url(#spectrum)"/>

    <!-- chart tab -->
    <rect x="40" y="26" width="178" height="26" rx="6" fill="#030c24" fill-opacity="0.7"/>
    <text x="52" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#93c5fd">CLINICAL CHART</text>

    <!-- name + subtitle -->
    <text x="40" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#eff6ff" letter-spacing="-1">Tia Kohir</text>
    <text x="42" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#dbeafe">I measure what AI is actually worth to a hospital. Nine-plus years provider-side.</text>

    <!-- face-sheet fields -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#bfdbfe">
      <text x="42" y="196"><tspan fill="#60a5fa" font-weight="700">MRN</tspan>  TiaKohir</text>
      <text x="232" y="196"><tspan fill="#60a5fa" font-weight="700">DOB</tspan>  2014 · first Epic go-live</text>
      <text x="548" y="196"><tspan fill="#fb7185" font-weight="700">SVC</tspan>  AI ROI · Clinical data</text>
      <text x="42" y="222"><tspan fill="#60a5fa" font-weight="700">LOC</tspan>  Bay Area</text>
      <text x="232" y="222"><tspan fill="#fbbf24" font-weight="700">ALLERGIES</tspan>  <tspan fill="#fde68a">Unmeasured ROI (severe)</tspan></text>
      <text x="548" y="222"><tspan fill="#60a5fa" font-weight="700">CODE STATUS</tspan>  Full code. SQL first.</text>
    </g>

    <!-- ECG trace, right side -->
    <g transform="translate(790 0)">
      <path id="ecg"
        d="M 0 150 L 40 150 L 52 150 L 60 138 L 68 150 L 90 150 L 98 156 L 104 96 L 110 198 L 116 150 L 150 150 L 164 136 L 178 150 L 230 150 L 242 150 L 250 138 L 258 150 L 280 150 L 288 156 L 294 96 L 300 198 L 306 150 L 340 150 L 354 136 L 368 150 L 410 150"
        fill="none" stroke="url(#fade)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1100" stroke-dashoffset="1100">
        <animate attributeName="stroke-dashoffset" from="1100" to="0" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#fecdd3">
        <animateMotion dur="3.2s" repeatCount="indefinite" rotate="0">
          <mpath xlink:href="#ecg"/>
        </animateMotion>
      </circle>
      <text x="300" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#60a5fa" text-anchor="middle">post-deployment · still measuring</text>
    </g>
  </g>
</svg>
