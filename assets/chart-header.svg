<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Tia Kohir — clinical chart header">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3d3a"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#5eead4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#99f6e4" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="url(#band)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>

    <!-- chart tab -->
    <rect x="40" y="26" width="178" height="26" rx="6" fill="#042f2e" fill-opacity="0.65"/>
    <text x="52" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#99f6e4">CLINICAL CHART</text>

    <!-- name + subtitle -->
    <text x="40" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f0fdfa" letter-spacing="-1">Tia Kohir</text>
    <text x="42" y="142" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#ccfbf1">Healthcare data → clinical AI value. Nine-plus years on the provider side.</text>

    <!-- face-sheet fields -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#99f6e4">
      <text x="42" y="196"><tspan fill="#5eead4" font-weight="700">MRN</tspan>  TiaKohir</text>
      <text x="232" y="196"><tspan fill="#5eead4" font-weight="700">DOB</tspan>  2014 · first Epic go-live</text>
      <text x="548" y="196"><tspan fill="#5eead4" font-weight="700">SVC</tspan>  Clinical data · AI value</text>
      <text x="42" y="222"><tspan fill="#5eead4" font-weight="700">LOC</tspan>  Pleasanton, CA</text>
      <text x="232" y="222"><tspan fill="#5eead4" font-weight="700">ALLERGIES</tspan>  Unmeasured ROI (severe)</text>
      <text x="548" y="222"><tspan fill="#5eead4" font-weight="700">CODE STATUS</tspan>  Full code. SQL first.</text>
    </g>

    <!-- ECG trace, right side -->
    <g transform="translate(790 0)">
      <path id="ecg"
        d="M 0 150 L 40 150 L 52 150 L 60 138 L 68 150 L 90 150 L 98 156 L 104 96 L 110 198 L 116 150 L 150 150 L 164 136 L 178 150 L 230 150 L 242 150 L 250 138 L 258 150 L 280 150 L 288 156 L 294 96 L 300 198 L 306 150 L 340 150 L 354 136 L 368 150 L 410 150"
        fill="none" stroke="url(#fade)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1100" stroke-dashoffset="1100">
        <animate attributeName="stroke-dashoffset" from="1100" to="0" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#ccfbf1">
        <animateMotion dur="3.2s" repeatCount="indefinite" rotate="0">
          <mpath xlink:href="#ecg"/>
        </animateMotion>
      </circle>
      <text x="300" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#5eead4" text-anchor="middle">post-deployment · still measuring</text>
    </g>
  </g>
</svg>
