<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Product lens: frame the problem, prioritize the backlog, ship and measure — a loop">
  <defs>
    <clipPath id="card2"><rect width="1000" height="260" rx="18"/></clipPath>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <g clip-path="url(#card2)">
    <rect width="1000" height="260" fill="#f8fafc"/>
    <rect width="1000" height="260" fill="url(#grid2)"/>
    <rect width="1000" height="260" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

    <!-- left: title -->
    <text x="40" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#64748b">PRODUCT LENS</text>
    <text x="40" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a" letter-spacing="-0.6">Structured.</text>
    <text x="40" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a" letter-spacing="-0.6">Strategic.</text>
    <text x="40" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#047857" letter-spacing="-0.6">Logical.</text>
    <text x="40" y="210" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#475569">The loop every clinical AI product goes through.</text>

    <!-- connectors -->
    <line x1="520" y1="112" x2="548" y2="112" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="750" y1="112" x2="778" y2="112" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <!-- return loop -->
    <path d="M 850 178 C 850 238, 400 238, 400 178" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M 850 178 C 850 238, 400 238, 400 178" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow-amber)">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
    <text x="625" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.5" fill="#b45309">learn · re-frame · repeat</text>

    <!-- box 1: FRAME -->
    <g transform="translate(330 48)">
      <rect width="190" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
        <animate attributeName="stroke" values="#e2e8f0;#10b981;#e2e8f0" keyTimes="0;0.1;0.35" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="0" width="166" height="4" rx="2" fill="#10b981"/>
      <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#047857">01 · FRAME</text>
      <text x="16" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Which clinician.</text>
      <text x="16" y="86" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Which moment.</text>
      <text x="16" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">What actually hurts.</text>
    </g>

    <!-- box 2: PRIORITIZE -->
    <g transform="translate(560 48)">
      <rect width="190" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
        <animate attributeName="stroke" values="#e2e8f0;#10b981;#e2e8f0" keyTimes="0;0.1;0.35" dur="6s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="0" width="166" height="4" rx="2" fill="#10b981"/>
      <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#047857">02 · PRIORITIZE</text>
      <text x="16" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Score the backlog.</text>
      <text x="16" y="86" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Fund the few.</text>
      <text x="16" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Say no, with a number.</text>
    </g>

    <!-- box 3: SHIP & MEASURE -->
    <g transform="translate(790 48)">
      <rect width="190" height="128" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
        <animate attributeName="stroke" values="#e2e8f0;#10b981;#e2e8f0" keyTimes="0;0.1;0.35" dur="6s" begin="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="0" width="166" height="4" rx="2" fill="#10b981"/>
      <text x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.2" fill="#047857">03 · SHIP &amp; MEASURE</text>
      <text x="16" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">PRD → go-live.</text>
      <text x="16" y="86" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Baseline → after.</text>
      <text x="16" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Value, attributed.</text>
    </g>
  </g>
</svg>
