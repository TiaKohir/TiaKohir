<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Product lens: frame the problem, prioritize the backlog, ship and measure — a loop">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a3f"/>
      <stop offset="60%" stop-color="#14306f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="card2"><rect width="1000" height="250" rx="18"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <path id="loop" d="M 850 170 C 850 230, 400 230, 400 170"/>
  </defs>

  <g clip-path="url(#card2)">
    <rect width="1000" height="250" fill="url(#bg2)"/>
    <rect width="1000" height="250" fill="url(#grid2)"/>

    <!-- left: title -->
    <text x="40" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#93c5fd">PRODUCT LENS</text>
    <text x="40" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#22d3ee" letter-spacing="-0.5">Structured.</text>
    <text x="40" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#a78bfa" letter-spacing="-0.5">Strategic.</text>
    <text x="40" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fb7185" letter-spacing="-0.5">Logical.</text>
    <text x="40" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#bfdbfe">The loop I run every clinical AI product through.</text>

    <!-- connectors -->
    <line x1="520" y1="110" x2="548" y2="110" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="750" y1="110" x2="778" y2="110" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <!-- return loop -->
    <path d="M 850 170 C 850 230, 400 230, 400 170" fill="none" stroke="#1e3a8a" stroke-width="3"/>
    <path d="M 850 170 C 850 230, 400 230, 400 170" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
    <text x="625" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.5" fill="#fbbf24">learn · re-frame · repeat</text>

    <!-- box 1: FRAME -->
    <g transform="translate(330 50)">
      <rect width="190" height="120" rx="12" fill="#0b2a6f" stroke="#1d4ed8" stroke-width="1.5">
        <animate attributeName="stroke" values="#1d4ed8;#22d3ee;#1d4ed8" keyTimes="0;0.1;0.35" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#22d3ee">01 · FRAME</text>
      <text x="16" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">Which clinician.</text>
      <text x="16" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">Which moment.</text>
      <text x="16" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">What actually hurts.</text>
    </g>

    <!-- box 2: PRIORITIZE -->
    <g transform="translate(560 50)">
      <rect width="190" height="120" rx="12" fill="#0b2a6f" stroke="#1d4ed8" stroke-width="1.5">
        <animate attributeName="stroke" values="#1d4ed8;#a78bfa;#1d4ed8" keyTimes="0;0.1;0.35" dur="6s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#a78bfa">02 · PRIORITIZE</text>
      <text x="16" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">Score the backlog.</text>
      <text x="16" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">Fund the few.</text>
      <text x="16" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">Say no, with a number.</text>
    </g>

    <!-- box 3: SHIP & MEASURE -->
    <g transform="translate(790 50)">
      <rect width="190" height="120" rx="12" fill="#0b2a6f" stroke="#1d4ed8" stroke-width="1.5">
        <animate attributeName="stroke" values="#1d4ed8;#fb7185;#1d4ed8" keyTimes="0;0.1;0.35" dur="6s" begin="4s" repeatCount="indefinite"/>
      </rect>
      <text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#fb7185">03 · SHIP &amp; MEASURE</text>
      <text x="16" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">PRD → go-live.</text>
      <text x="16" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">Baseline → after.</text>
      <text x="16" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#eff6ff">Value, attributed.</text>
    </g>
  </g>
</svg>
