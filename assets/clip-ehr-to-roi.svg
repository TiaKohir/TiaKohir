<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Animated clip: from the EHR to the ROI — EHR workflows, clinical data, clinical AI, clinician adoption, measured value">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#151a3d"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#c7d2fe" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="400" rx="18"/></clipPath>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="850" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="27%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="75%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <path id="track" d="M 150 240 L 850 240"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="400" fill="url(#bg)"/>
    <rect width="1000" height="400" fill="url(#grid)"/>

    <!-- title -->
    <text x="40" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#a5b4fc">WHAT I WORK ON</text>
    <text x="40" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="-0.6">From the EHR to the ROI.</text>
    <text x="40" y="134" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#c7d2fe">One pipeline. Every step measured. The number at the end is the point.</text>

    <!-- base track -->
    <line x1="150" y1="240" x2="850" y2="240" stroke="#2e3464" stroke-width="4" stroke-linecap="round"/>
    <!-- lit track, redrawn each loop -->
    <line x1="150" y1="240" x2="850" y2="240" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="700" stroke-dashoffset="700">
      <animate attributeName="stroke-dashoffset" values="700;0;0;700" keyTimes="0;0.8;0.95;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <!-- pulses -->
    <circle r="6" fill="#f8fafc">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"><mpath xlink:href="#track"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#c7d2fe">
      <animateMotion dur="8s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"><mpath xlink:href="#track"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- ===== STATION 1: EHR ===== -->
    <g transform="translate(108 240)">
      <circle r="62" fill="url(#glow-cyan)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.25;0.4" dur="8s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="#121a3a" stroke="#22d3ee" stroke-width="2.5">
        <animate attributeName="stroke-width" values="2.5;6;2.5" keyTimes="0;0.06;0.2" dur="8s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <rect x="-22" y="-18" width="44" height="28" rx="3" fill="none" stroke="#f8fafc" stroke-width="2.4"/>
      <polyline points="-15,2 -8,-5 -1,1 7,-9 15,-2" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-9" y1="20" x2="9" y2="20" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="0" y2="20" stroke="#f8fafc" stroke-width="2.4"/>
      <text y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">EHR workflows</text>
    </g>

    <!-- ===== STATION 2: Clinical data ===== -->
    <g transform="translate(304 240)">
      <circle r="62" fill="url(#glow-blue)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.25;0.4" dur="8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="#121a3a" stroke="#60a5fa" stroke-width="2.5">
        <animate attributeName="stroke-width" values="2.5;6;2.5" keyTimes="0;0.06;0.2" dur="8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="0" cy="-15" rx="18" ry="7" fill="none" stroke="#f8fafc" stroke-width="2.4"/>
      <path d="M -18 -15 V 13 A 18 7 0 0 0 18 13 V -15" fill="none" stroke="#f8fafc" stroke-width="2.4"/>
      <path d="M -18 -1 A 18 7 0 0 0 18 -1" fill="none" stroke="#60a5fa" stroke-width="2.4"/>
      <text y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Clinical data</text>
    </g>

    <!-- ===== STATION 3: Clinical AI ===== -->
    <g transform="translate(500 240)">
      <circle r="62" fill="url(#glow-violet)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.25;0.4" dur="8s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="#121a3a" stroke="#a78bfa" stroke-width="2.5">
        <animate attributeName="stroke-width" values="2.5;6;2.5" keyTimes="0;0.06;0.2" dur="8s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="none" stroke="#f8fafc" stroke-width="2.4"/>
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#a78bfa"/>
      <g stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round">
        <line x1="-7" y1="-15" x2="-7" y2="-22"/><line x1="7" y1="-15" x2="7" y2="-22"/>
        <line x1="-7" y1="15" x2="-7" y2="22"/><line x1="7" y1="15" x2="7" y2="22"/>
        <line x1="-15" y1="-7" x2="-22" y2="-7"/><line x1="-15" y1="7" x2="-22" y2="7"/>
        <line x1="15" y1="-7" x2="22" y2="-7"/><line x1="15" y1="7" x2="22" y2="7"/>
      </g>
      <text y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Clinical AI</text>
    </g>

    <!-- ===== STATION 4: Adoption ===== -->
    <g transform="translate(696 240)">
      <circle r="62" fill="url(#glow-amber)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.25;0.4" dur="8s" begin="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="#121a3a" stroke="#fbbf24" stroke-width="2.5">
        <animate attributeName="stroke-width" values="2.5;6;2.5" keyTimes="0;0.06;0.2" dur="8s" begin="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-10" cy="-10" r="7" fill="none" stroke="#f8fafc" stroke-width="2.4"/>
      <path d="M -23 14 A 13 13 0 0 1 3 14" fill="none" stroke="#f8fafc" stroke-width="2.4"/>
      <circle cx="12" cy="-8" r="5.5" fill="none" stroke="#c7d2fe" stroke-width="2.2"/>
      <path d="M 2 14 A 10 10 0 0 1 22 14" fill="none" stroke="#c7d2fe" stroke-width="2.2"/>
      <polyline points="9,2 14,7 24,-4" fill="none" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Clinician adoption</text>
    </g>

    <!-- ===== STATION 5: ROI ===== -->
    <g transform="translate(892 240)">
      <circle r="62" fill="url(#glow-green)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.3;0.45" dur="8s" begin="6.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="#121a3a" stroke="#34d399" stroke-width="2.5">
        <animate attributeName="stroke-width" values="2.5;6;2.5" keyTimes="0;0.06;0.2" dur="8s" begin="6.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M -24 9 A 24 24 0 0 1 24 9" fill="none" stroke="#1f3a33" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M -24 9 A 24 24 0 0 1 24 9" fill="none" stroke="#34d399" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="76" stroke-dashoffset="76">
        <animate attributeName="stroke-dashoffset" values="76;76;8;8;76" keyTimes="0;0.8;0.9;0.98;1" dur="8s" repeatCount="indefinite"/>
      </path>
      <line x1="0" y1="9" x2="-21" y2="3" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 0 9;0 0 9;145 0 9;145 0 9;0 0 9" keyTimes="0;0.8;0.9;0.98;1" dur="8s" repeatCount="indefinite"/>
      </line>
      <circle cx="0" cy="9" r="3.2" fill="#f8fafc"/>
      <text y="30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#34d399">ROI</text>
      <text y="86" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Measured value</text>
    </g>

    <!-- footer line -->
    <text x="40" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" letter-spacing="1" fill="#34d399">accuracy is a model metric · roi is a hospital metric</text>
  </g>
</svg>
