<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Animated clip: from the EHR to the ROI — EHR workflows, clinical data, clinical AI, clinician adoption, measured value">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a3f"/>
      <stop offset="60%" stop-color="#14306f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="420" rx="18"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="840" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="28%" stop-color="#34d399"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="76%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-emerald" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-coral" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fb7185" stop-opacity="0.5"/><stop offset="100%" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <path id="track" d="M 160 250 L 840 250"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="420" fill="url(#bg)"/>
    <rect width="1000" height="420" fill="url(#grid)"/>

    <!-- title -->
    <text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#93c5fd">WHAT I WORK ON</text>
    <text x="40" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#eff6ff" letter-spacing="-0.5">From the EHR to the ROI.</text>
    <text x="40" y="126" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#bfdbfe">One pipeline. Every step measured. The number at the end is the point.</text>

    <!-- base track -->
    <line x1="160" y1="250" x2="840" y2="250" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
    <!-- lit track, redrawn each loop -->
    <line x1="160" y1="250" x2="840" y2="250" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="680" stroke-dashoffset="680">
      <animate attributeName="stroke-dashoffset" values="680;0;0;680" keyTimes="0;0.8;0.95;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <!-- pulses -->
    <circle r="6" fill="#dbeafe">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"><mpath xlink:href="#track"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#93c5fd">
      <animateMotion dur="8s" begin="0.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear"><mpath xlink:href="#track"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.78;0.82;1" dur="8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- ===== STATION 1: EHR ===== -->
    <g transform="translate(120 250)">
      <circle r="58" fill="url(#glow-cyan)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.25;0.4" dur="8s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle r="40" fill="#0b2a6f" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.06;0.2" dur="8s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <!-- monitor icon -->
      <rect x="-20" y="-16" width="40" height="26" rx="3" fill="none" stroke="#dbeafe" stroke-width="2.2"/>
      <polyline points="-14,2 -7,-4 -1,1 6,-8 14,-2" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-8" y1="18" x2="8" y2="18" stroke="#dbeafe" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="10" x2="0" y2="18" stroke="#dbeafe" stroke-width="2.2"/>
      <text y="72" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eff6ff">EHR workflows</text>
      <text y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#22d3ee">Epic · Clarity</text>
      <text y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#22d3ee">Caboodle · Cogito</text>
    </g>

    <!-- ===== STATION 2: Clinical data ===== -->
    <g transform="translate(310 250)">
      <circle r="58" fill="url(#glow-emerald)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.25;0.4" dur="8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="40" fill="#0b2a6f" stroke="#34d399" stroke-width="2">
        <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.06;0.2" dur="8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <!-- database icon -->
      <ellipse cx="0" cy="-14" rx="16" ry="6" fill="none" stroke="#dbeafe" stroke-width="2.2"/>
      <path d="M -16 -14 V 12 A 16 6 0 0 0 16 12 V -14" fill="none" stroke="#dbeafe" stroke-width="2.2"/>
      <path d="M -16 -1 A 16 6 0 0 0 16 -1" fill="none" stroke="#34d399" stroke-width="2.2"/>
      <text y="72" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eff6ff">Clinical data</text>
      <text y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#34d399">OMOP · Databricks</text>
      <text y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#34d399">Fabric · dbt</text>
    </g>

    <!-- ===== STATION 3: Clinical AI ===== -->
    <g transform="translate(500 250)">
      <circle r="58" fill="url(#glow-violet)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.25;0.4" dur="8s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="40" fill="#0b2a6f" stroke="#a78bfa" stroke-width="2">
        <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.06;0.2" dur="8s" begin="3.2s" repeatCount="indefinite"/>
      </circle>
      <!-- chip icon -->
      <rect x="-14" y="-14" width="28" height="28" rx="4" fill="none" stroke="#dbeafe" stroke-width="2.2"/>
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#a78bfa"/>
      <g stroke="#dbeafe" stroke-width="2" stroke-linecap="round">
        <line x1="-7" y1="-14" x2="-7" y2="-20"/><line x1="7" y1="-14" x2="7" y2="-20"/>
        <line x1="-7" y1="14" x2="-7" y2="20"/><line x1="7" y1="14" x2="7" y2="20"/>
        <line x1="-14" y1="-7" x2="-20" y2="-7"/><line x1="-14" y1="7" x2="-20" y2="7"/>
        <line x1="14" y1="-7" x2="20" y2="-7"/><line x1="14" y1="7" x2="20" y2="7"/>
      </g>
      <text y="72" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eff6ff">Clinical AI</text>
      <text y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a78bfa">summaries · alerts</text>
      <text y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a78bfa">automations</text>
    </g>

    <!-- ===== STATION 4: Adoption ===== -->
    <g transform="translate(690 250)">
      <circle r="58" fill="url(#glow-amber)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.25;0.4" dur="8s" begin="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="40" fill="#0b2a6f" stroke="#fbbf24" stroke-width="2">
        <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.06;0.2" dur="8s" begin="4.8s" repeatCount="indefinite"/>
      </circle>
      <!-- clinicians icon: two people + check -->
      <circle cx="-9" cy="-9" r="6" fill="none" stroke="#dbeafe" stroke-width="2.2"/>
      <path d="M -21 12 A 12 12 0 0 1 3 12" fill="none" stroke="#dbeafe" stroke-width="2.2"/>
      <circle cx="11" cy="-7" r="5" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <path d="M 2 12 A 9 9 0 0 1 20 12" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <polyline points="8,2 13,7 22,-4" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="72" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eff6ff">Clinician adoption</text>
      <text y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fbbf24">attention budget</text>
      <text y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fbbf24">fatigue · telemetry</text>
    </g>

    <!-- ===== STATION 5: ROI ===== -->
    <g transform="translate(880 250)">
      <circle r="58" fill="url(#glow-coral)" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.3;0.45" dur="8s" begin="6.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="40" fill="#0b2a6f" stroke="#fb7185" stroke-width="2">
        <animate attributeName="stroke-width" values="2;5;2" keyTimes="0;0.06;0.2" dur="8s" begin="6.4s" repeatCount="indefinite"/>
      </circle>
      <!-- gauge -->
      <path d="M -22 8 A 22 22 0 0 1 22 8" fill="none" stroke="#3b1d2e" stroke-width="5" stroke-linecap="round"/>
      <path d="M -22 8 A 22 22 0 0 1 22 8" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round" stroke-dasharray="69" stroke-dashoffset="69">
        <animate attributeName="stroke-dashoffset" values="69;69;8;8;69" keyTimes="0;0.8;0.9;0.98;1" dur="8s" repeatCount="indefinite"/>
      </path>
      <line x1="0" y1="8" x2="-19" y2="2" stroke="#eff6ff" stroke-width="2.6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 0 8;0 0 8;145 0 8;145 0 8;0 0 8" keyTimes="0;0.8;0.9;0.98;1" dur="8s" repeatCount="indefinite"/>
      </line>
      <circle cx="0" cy="8" r="3" fill="#eff6ff"/>
      <text y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#fb7185">ROI</text>
      <text y="72" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eff6ff">Measured value</text>
      <text y="94" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fb7185">benefit attribution</text>
      <text y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#fb7185">baseline → after</text>
    </g>

    <!-- footer line -->
    <text x="40" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#fb7185">accuracy is a model metric · roi is a hospital metric</text>
  </g>
</svg>
