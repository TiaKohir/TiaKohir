<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-label="Four health systems I've built inside: CommonSpirit Health (Epic build), Sutter Health (BI and ETL), NYU Langone Health (clinical analytics), Stanford Health Care (AI value and product)">
  <defs>
    <clipPath id="card3"><rect width="1000" height="370" rx="18"/></clipPath>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <symbol id="hosp" viewBox="0 0 40 40">
      <rect x="6" y="10" width="28" height="26" rx="2" fill="none" stroke="#334155" stroke-width="2"/>
      <rect x="16" y="4" width="8" height="6" rx="1" fill="none" stroke="#334155" stroke-width="2"/>
      <line x1="20" y1="16" x2="20" y2="26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="15" y1="21" x2="25" y2="21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
      <rect x="17" y="30" width="6" height="6" fill="#334155"/>
    </symbol>
  </defs>

  <g clip-path="url(#card3)">
    <rect width="1000" height="370" fill="#f8fafc"/>
    <rect width="1000" height="370" fill="url(#grid3)"/>
    <rect width="1000" height="370" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

    <text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#64748b">HEALTH SYSTEMS I'VE BUILT INSIDE</text>

    <!-- tile 1: CommonSpirit -->
    <g transform="translate(40 74)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
      <rect width="450" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="0" y="20" width="5" height="90" rx="2.5" fill="#06b6d4"/>
      <use href="#hosp" x="20" y="20" width="40" height="40" color="#0891b2"/>
      <text x="76" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">CommonSpirit Health</text>
      <text x="76" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#0e7490">EPIC BUILD SIDE</text>
      <text x="76" y="89" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Five years of Epic build: ASAP, SmartForms, Cogito,</text>
      <text x="76" y="111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Clarity, Caboodle — the data everyone else inherits.</text>
    </g>

    <!-- tile 2: Sutter -->
    <g transform="translate(510 74)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.35s" fill="freeze"/>
      <rect width="450" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="0" y="20" width="5" height="90" rx="2.5" fill="#3b82f6"/>
      <use href="#hosp" x="20" y="20" width="40" height="40" color="#2563eb"/>
      <text x="76" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Sutter Health</text>
      <text x="76" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#1d4ed8">BI &amp; ETL</text>
      <text x="76" y="89" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">SQL and ETL for the people who run the hospital.</text>
      <text x="76" y="111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">KPI reporting that had to be right on the first look.</text>
    </g>

    <!-- tile 3: NYU Langone -->
    <g transform="translate(40 222)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
      <rect width="450" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="0" y="20" width="5" height="90" rx="2.5" fill="#8b5cf6"/>
      <use href="#hosp" x="20" y="20" width="40" height="40" color="#7c3aed"/>
      <text x="76" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">NYU Langone Health</text>
      <text x="76" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#6d28d9">CLINICAL ANALYTICS</text>
      <text x="76" y="89" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Oncology data marts on Hadoop / Impala. Collibra.</text>
      <text x="76" y="111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Led the ETL audit: standards, code review, sign-off.</text>
    </g>

    <!-- tile 4: Stanford -->
    <g transform="translate(510 222)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.85s" fill="freeze"/>
      <rect width="450" height="130" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="20" width="5" height="90" rx="2.5" fill="#10b981"/>
      <use href="#hosp" x="20" y="20" width="40" height="40" color="#059669"/>
      <text x="76" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Stanford Health Care</text>
      <text x="76" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#047857">AI VALUE &amp; PRODUCT</text>
      <text x="76" y="89" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Put a number on four live clinical AI automations.</text>
      <text x="76" y="111" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#334155">Scored the AI backlog. Wrote the PRD framework.</text>
    </g>
  </g>
</svg>
