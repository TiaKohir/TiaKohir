<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Four health systems I've built inside: CommonSpirit Health (Epic build), Sutter Health (BI and ETL), NYU Langone Health (clinical analytics), Stanford Health Care (AI value and product)">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a3f"/>
      <stop offset="60%" stop-color="#14306f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="card3"><rect width="1000" height="360" rx="18"/></clipPath>
    <!-- hospital icon -->
    <symbol id="hosp" viewBox="0 0 40 40">
      <rect x="6" y="10" width="28" height="26" rx="2" fill="none" stroke="#dbeafe" stroke-width="2"/>
      <rect x="16" y="4" width="8" height="6" rx="1" fill="none" stroke="#dbeafe" stroke-width="2"/>
      <line x1="20" y1="16" x2="20" y2="26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="15" y1="21" x2="25" y2="21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="17" y="30" width="6" height="6" fill="#dbeafe"/>
    </symbol>
  </defs>

  <g clip-path="url(#card3)">
    <rect width="1000" height="360" fill="url(#bg3)"/>
    <rect width="1000" height="360" fill="url(#grid3)"/>

    <text x="40" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#93c5fd">HEALTH SYSTEMS I'VE BUILT INSIDE</text>

    <!-- tile 1: CommonSpirit -->
    <g transform="translate(40 72)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
      <rect width="450" height="125" rx="12" fill="#0b2a6f" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="1" y="18" width="5" height="89" rx="2.5" fill="#22d3ee"/>
      <use href="#hosp" x="18" y="18" width="40" height="40" color="#22d3ee"/>
      <text x="74" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#eff6ff">CommonSpirit Health</text>
      <text x="74" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#22d3ee">EPIC BUILD SIDE</text>
      <text x="74" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#dbeafe">Five years of Epic build: ASAP, SmartForms, Cogito,</text>
      <text x="74" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#dbeafe">Clarity, Caboodle — the data everyone else inherits.</text>
    </g>

    <!-- tile 2: Sutter -->
    <g transform="translate(510 72)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.35s" fill="freeze"/>
      <rect width="450" height="125" rx="12" fill="#0b2a6f" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="1" y="18" width="5" height="89" rx="2.5" fill="#34d399"/>
      <use href="#hosp" x="18" y="18" width="40" height="40" color="#34d399"/>
      <text x="74" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#eff6ff">Sutter Health</text>
      <text x="74" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#34d399">BI &amp; ETL</text>
      <text x="74" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#dbeafe">SQL and ETL for the people who run the hospital.</text>
      <text x="74" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#dbeafe">KPI reporting that had to be right on the first look.</text>
    </g>

    <!-- tile 3: NYU Langone -->
    <g transform="translate(40 215)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
      <rect width="450" height="125" rx="12" fill="#0b2a6f" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="1" y="18" width="5" height="89" rx="2.5" fill="#a78bfa"/>
      <use href="#hosp" x="18" y="18" width="40" height="40" color="#a78bfa"/>
      <text x="74" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#eff6ff">NYU Langone Health</text>
      <text x="74" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#a78bfa">CLINICAL ANALYTICS</text>
      <text x="74" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#dbeafe">Oncology data marts on Hadoop / Impala. Collibra.</text>
      <text x="74" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#dbeafe">Led the ETL audit: standards, code review, sign-off.</text>
    </g>

    <!-- tile 4: Stanford -->
    <g transform="translate(510 215)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.85s" fill="freeze"/>
      <rect width="450" height="125" rx="12" fill="#0b2a6f" stroke="#fb7185" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="1" y="18" width="5" height="89" rx="2.5" fill="#fb7185"/>
      <use href="#hosp" x="18" y="18" width="40" height="40" color="#fb7185"/>
      <text x="74" y="36" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#eff6ff">Stanford Health Care</text>
      <text x="74" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#fb7185">AI VALUE &amp; PRODUCT</text>
      <text x="74" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#dbeafe">Put a number on four live clinical AI automations.</text>
      <text x="74" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#dbeafe">Scored the AI backlog. Wrote the PRD framework.</text>
    </g>
  </g>
</svg>
